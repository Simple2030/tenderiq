name: Fetch RMI Tenders

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Fetch tenders from RMI
        run: |
          python3 << 'PYEOF'
          import json, time, sys
          from datetime import datetime
          import requests

          # Hardcoded parameters
          DATE_FROM = datetime(2024, 4, 1)
          DATE_TO   = datetime(2026, 4, 12)

          BASE = "https://apps.land.gov.il/MichrazimSite/api"
          HEADERS = {
              "User-Agent": "datagov-external-client",
              "Content-Type": "application/json",
              "Accept": "application/json, text/plain, */*",
              "Origin": "https://apps.land.gov.il",
              "Referer": "https://apps.land.gov.il/MichrazimSite/",
          }
          S = requests.Session()
          S.headers.update(HEADERS)

          # Step 1: Fetch ALL tenders with results (no date filter - API ignores it)
          payload = {
              "ActiveQuickSearch": False,
              "ActiveMichraz": False,
              "hasResults": True,
          }
          print(f"[1] Fetching all tenders with results...", flush=True)
          r = S.post(f"{BASE}/SearchApi/Search", json=payload, timeout=60)
          r.raise_for_status()
          data = r.json()
          all_tenders = data if isinstance(data, list) else data.get("results", [])
          print(f"[1] Got {len(all_tenders)} total tenders from API", flush=True)

          # Step 2: Client-side filter by VaadaDate
          def parse_date(s):
              if not s: return None
              try: return datetime.fromisoformat(s.replace("+03:00","").replace("+02:00",""))
              except: return None

          filtered = []
          for t in all_tenders:
              vd = parse_date(t.get("VaadaDate"))
              if vd and DATE_FROM <= vd <= DATE_TO:
                  filtered.append(t)
          print(f"[2] After date filter ({DATE_FROM.date()} to {DATE_TO.date()}): {len(filtered)} tenders", flush=True)

          # Step 3: Split by category
          cats = {
              "mechir_lemishtaken": [],  # SugMichraz 2 or 3
              "yazamot": [],             # SugMichraz 1
              "malonaut": [],            # YeudMichraz 4, 6, or 7
          }
          for t in filtered:
              sug = t.get("KodSugMichraz")
              yeud = t.get("KodYeudMichraz")
              if yeud in (4, 6, 7):
                  cats["malonaut"].append(t)
              elif sug in (2, 3):
                  cats["mechir_lemishtaken"].append(t)
              elif sug == 1:
                  cats["yazamot"].append(t)

          for name, lst in cats.items():
              print(f"  {name}: {len(lst)} tenders", flush=True)

          # Step 4: Fetch details for up to 50 per category
          out = {
              "fetched_at": datetime.utcnow().isoformat(),
              "date_from": str(DATE_FROM.date()),
              "date_to": str(DATE_TO.date()),
              "total_with_results": len(all_tenders),
              "total_in_date_range": len(filtered),
              "categories": {},
          }

          for name, basics in cats.items():
              print(f"\n=== {name} ({len(basics)} basics, fetching details for max 50) ===", flush=True)
              basics = basics[:50]
              cat = {"search_count": len(basics), "tenders": []}
              for i, b in enumerate(basics, 1):
                  mid = b.get("MichrazID")
                  if not mid: continue
                  try:
                      time.sleep(0.5)
                      r2 = S.get(f"{BASE}/MichrazDetailsApi/Get",
                                 params={"michrazID": mid}, timeout=30)
                      r2.raise_for_status()
                      det = r2.json()
                      cat["tenders"].append({"basic": b, "details": det})
                      vaada = b.get("VaadaDate","")[:10]
                      mname = b.get("MichrazName","?")
                      print(f"  [{i}/{len(basics)}] {mname} vaada={vaada} OK", flush=True)
                  except Exception as e:
                      print(f"  [{i}/{len(basics)}] {mid} FAIL: {e}", flush=True)
              out["categories"][name] = cat

          with open("rmi_raw.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          sz = len(open("rmi_raw.json").read())
          print(f"\nDone! wrote rmi_raw.json ({sz:,} bytes)")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: rmi-raw-json
          path: rmi_raw.json
          retention-days: 14

      - name: Commit to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          cp rmi_raw.json output/rmi_raw.json
          git add output/rmi_raw.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci: fetch RMI tenders $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
