name: Fetch RMI Tenders

# Pulls every Israel Land Authority tender with published results whose
# committee date falls in the window, with full lot and bid details, and
# commits output/rmi_raw.json.gz to the branch the run was started on.
on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Committee date from (YYYY-MM-DD)"
        required: true
        default: "2024-04-01"
      date_to:
        description: "Committee date to (YYYY-MM-DD, empty = today)"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Fetch tenders from RMI
        env:
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
        run: |
          python3 << 'PYEOF'
          import gzip, json, os, time
          from datetime import datetime, timezone
          import requests

          DATE_FROM = datetime.fromisoformat(os.environ.get("DATE_FROM") or "2024-04-01")
          DATE_TO = datetime.fromisoformat(os.environ["DATE_TO"]) if os.environ.get("DATE_TO") else datetime.now()

          BASE = "https://apps.land.gov.il/MichrazimSite/api"
          S = requests.Session()
          S.headers.update({
              "User-Agent": "datagov-external-client",
              "Content-Type": "application/json",
              "Accept": "application/json, text/plain, */*",
              "Origin": "https://apps.land.gov.il",
              "Referer": "https://apps.land.gov.il/MichrazimSite/",
          })

          def get(url, params):
              for attempt in range(4):
                  try:
                      r = S.get(url, params=params, timeout=60)
                      r.raise_for_status()
                      return r.json()
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)

          # The search endpoint ignores its date filters, so filter here.
          r = S.post(f"{BASE}/SearchApi/Search", json={"ActiveQuickSearch": False, "ActiveMichraz": False, "hasResults": True}, timeout=120)
          r.raise_for_status()
          data = r.json()
          all_tenders = data if isinstance(data, list) else data.get("results", [])
          print(f"{len(all_tenders)} tenders with results in the source", flush=True)

          def vaada(t):
              s = t.get("VaadaDate")
              try:
                  return datetime.fromisoformat(s[:19]) if s else None
              except ValueError:
                  return None

          in_range = [t for t in all_tenders if (d := vaada(t)) and DATE_FROM <= d <= DATE_TO]
          print(f"{len(in_range)} with committee date {DATE_FROM.date()} to {DATE_TO.date()}", flush=True)

          # Same three buckets as before so the build scripts keep working;
          # tenders of any other type go to "other". No cap per bucket.
          cats = {"mechir_lemishtaken": [], "yazamot": [], "malonaut": [], "other": []}
          for t in in_range:
              sug, yeud = t.get("KodSugMichraz"), t.get("KodYeudMichraz")
              key = ("malonaut" if yeud in (4, 6, 7) else "mechir_lemishtaken" if sug in (2, 3)
                     else "yazamot" if sug == 1 else "other")
              cats[key].append(t)

          out = {
              "fetched_at": datetime.now(timezone.utc).isoformat(),
              "date_from": str(DATE_FROM.date()),
              "date_to": str(DATE_TO.date()),
              "total_with_results": len(all_tenders),
              "total_in_date_range": len(in_range),
              "categories": {},
              "failed": [],
          }
          done = 0
          for name, basics in cats.items():
              tenders = []
              for b in basics:
                  mid = b.get("MichrazID")
                  try:
                      det = get(f"{BASE}/MichrazDetailsApi/Get", params={"michrazID": mid})
                      tenders.append({"basic": b, "details": det})
                  except Exception as e:
                      out["failed"].append({"MichrazID": mid, "error": str(e)[:200]})
                  done += 1
                  if done % 25 == 0:
                      print(f"  {done}/{len(in_range)}", flush=True)
                  time.sleep(0.4)
              out["categories"][name] = {"search_count": len(basics), "tenders": tenders}
              print(f"{name}: {len(tenders)} of {len(basics)} fetched", flush=True)

          os.makedirs("output", exist_ok=True)
          with gzip.open("output/rmi_raw.json.gz", "wt", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print(f"wrote output/rmi_raw.json.gz ({os.path.getsize('output/rmi_raw.json.gz'):,} bytes), "
                f"{len(out['failed'])} failed", flush=True)
          PYEOF

      - name: Commit to the branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/rmi_raw.json.gz
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci: fetch RMI tenders $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
