name: Fetch RMI Code Tables

# Saves the lookup tables the tender site uses (tender types, land uses,
# regions) so the dashboard names codes the way the authority does.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch lookups
        run: |
          python3 << 'PYEOF'
          import json, re, urllib.request
          H = {"User-Agent": "datagov-external-client", "Origin": "https://apps.land.gov.il",
               "Referer": "https://apps.land.gov.il/MichrazimSite/", "Accept": "application/json, text/plain, */*"}
          SITE = "https://apps.land.gov.il/MichrazimSite/"
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=60) as r:
                  return r.read().decode("utf-8", "replace")
          out = {"api_paths": [], "lookups": {}, "bundle_hits": {}}
          html = get(SITE)
          scripts = re.findall(r'src="([^"]+\.js)"', html)
          for s in scripts:
              js = get(s if s.startswith("http") else SITE + s.lstrip("/"))
              out["api_paths"] += sorted(set(re.findall(r'api/[A-Za-z]+Api/[A-Za-z]+', js)))
              for key in ("KodSugMichraz", "SugMichraz", "KodMerchav", "Merchav", "KodYeudMichraz", "Yeud"):
                  for m in re.finditer(key, js):
                      out["bundle_hits"].setdefault(key, []).append(js[max(0, m.start() - 300): m.end() + 600])
          out["api_paths"] = sorted(set(out["api_paths"]))
          for p in out["api_paths"]:
              if re.search(r'(?i)lookup|table|code|kod|list|enum|reference|param', p):
                  try:
                      out["lookups"][p] = json.loads(get("https://apps.land.gov.il/MichrazimSite/" + p))
                  except Exception as e:
                      out["lookups"][p] = f"error: {e}"[:200]
          for k in out["bundle_hits"]:
              out["bundle_hits"][k] = out["bundle_hits"][k][:15]
          json.dump(out, open("output/rmi_codes.json", "w"), ensure_ascii=False, indent=1)
          print(out["api_paths"])
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/rmi_codes.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: fetch RMI code tables"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
